<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<div id="hearts"></div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">
    🎵
</button>

<!-- PAGE 1 -->

<section class="page active" id="page1">

<div class="glass hero">

<h3>Happy Girlfriend's Day ❤️</h3>

<h1>Tanu</h1>

<p>
I made something special just for you...
</p>

<button class="nextBtn" data-next="page2">
Open My Gift 💌
</button>

</div>

</section>

<!-- PAGE 2 -->

<section class="page" id="page2">

<div class="glass">

<div class="envelope" id="envelope">

<div class="letter">

<h2>My Love ❤️</h2>

<p id="typedText"></p>

</div>

</div>

<button class="nextBtn" data-next="page3">
Continue 🌸
</button>

</div>

</section>

<!-- PAGE 3 -->

<section class="page" id="page3">

<div class="glass">

<h2>Why You? ❤️</h2>

<div id="reasonCard">

<p id="reasonText"></p>

</div>

<div class="reasonButtons">

<button id="prevReason">
Previous
</button>

<button id="nextReason">
Next
</button>

</div>

<div id="dots"></div>

<br>

<button class="nextBtn" data-next="page4">
Next ❤️
</button>

</div>

</section>
<!-- PAGE 4 -->

<section class="page" id="page4">

<div class="glass">

<h2>Tap My Heart ❤️</h2>

<div id="heartContainer">

<div id="heart">
❤️
</div>

<p id="heartMessage">
Tap the heart...
</p>

</div>

<button class="nextBtn hidden" id="videoBtn" data-next="page5">
One Last Surprise 🎥
</button>

</div>

</section>

<!-- PAGE 5 -->

<section class="page" id="page5">

<div class="glass">

<h2>Our Little Movie ❤️</h2>

<video id="ourVideo" controls playsinline preload="metadata">
    <source src="video.mp4" type="video/mp4">
    Your browser doesn't support video.
</video>

<p class="endingText">
Thank you for being the best part of my life.
<br><br>
No matter where life takes us,
I'll always choose you.
<br><br>
Happy Girlfriend's Day ❤️
</p>

<button id="restartBtn">
Replay Our Story ↺
</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
