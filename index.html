<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<div id="hearts"></div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">
    🎵
</button>

<!-- PAGE 1 -->

<section class="page active" id="page1">

<div class="glass hero">

<h3>Happy Girlfriend's Day ❤️</h3>

<h1>Tanu</h1>

<p>
I made something special just for you...
</p>

<button class="nextBtn" data-next="page2">
Open My Gift 💌
</button>

</div>

</section>

<!-- PAGE 2 -->

<section class="page" id="page2">

<div class="glass">

<div class="envelope" id="envelope">

<div class="letter">

<h2>My Love ❤️</h2>

<p id="typedText"></p>

</div>

</div>

<button class="nextBtn" data-next="page3">
Continue 🌸
</button>

</div>

</section>

<!-- PAGE 3 -->

<section class="page" id="page3">

<div class="glass">

<h2>Why You? ❤️</h2>

<div id="reasonCard">

<p id="reasonText"></p>

</div>

<div class="reasonButtons">

<button id="prevReason">
Previous
</button>

<button id="nextReason">
Next
</button>

</div>

<div id="dots"></div>

<br>

<button class="nextBtn" data-next="page4">
Next ❤️
</button>

</div>

</section>
